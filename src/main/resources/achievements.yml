# ============================================================
#  Succès (/succes)
# ============================================================
#
#  categories : dans l'ordre du menu ; guided = des étapes à faire dans l'ordre, avec un indice (Premiers pas).
#  achievements : dans l'ordre de leur catégorie. Pour chacun :
#    kind  : break (casser des blocs NATURELS : un bloc posé par un joueur ne compte pas), harvest (cultures mûres),
#            kill, fish, breed (faire naître), enchant, death, playtime (minutes de jeu actif), resource (arrivées en
#            monde ressource), quest (quêtes de métier), challenge (défis) ; états relus chaque minute : job, homes,
#            money, clan, pass-tier, daily
#    match : blocs, créatures ou prises qui comptent (vide : tout). Groupes : #ores, #logs, #crops, #stone, #monsters
#    tag   : quest -> le métier ; challenge -> daily ou weekly ; fish -> fish, treasure ou junk
#    tiers : de 1 à 5 niveaux (le compteur à atteindre pour chacun)
#    subject : nom affiché (lang subject.<subject>) quand le nom du bloc ou de la créature ne suffit pas
#    rewards : récompense de chaque niveau à la place de config.yml > tiers (money, points, commands)
#  Les textes (noms, indices, descriptions) sont dans lang/. Ne pas renommer un succès : sa progression est gardée
#  sous son identifiant.

