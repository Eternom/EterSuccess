# EterSuccess messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
# Values between <> like <target> are filled by the plugin. To show a "<", write \< between 'single quotes'.
# A missing key falls back to the text built into the plugin.

unlock:
  message: "<info>Achievement unlocked: <accent><name></accent>! <accent>+<money></accent>, <accent>+<points> points</accent>."
  step: "<success>Step complete:</success> <accent><name></accent>! <accent>+<money></accent>."
  # Public announcement (config.yml > announce), instead of Minecraft advancements; legend: tier V
  public: "<accent><player></accent> <info>unlocked the achievement <success>[<name>]"
  legend: "<accent><player></accent> <info>reached tier <accent>V</accent> of <success>[<name>]</success><info>!"

guide:
  next: "<info>First steps <dark_gray>(<step>/<steps>)</dark_gray>: <accent><hint></accent> <dark_gray>· the whole server is in /menu"
  button: "<accent><bold>[See my achievements]</bold></accent>"
  button-hover: "<info>Open <accent>/succes"

menu:
  title: "<primary>Achievements"
  player: "<accent><player>"
  points: "<dark_gray>▸ <info>Achievement points: <accent><points>"
  unlocked: "<dark_gray>▸ <info>Tiers unlocked: <accent><count></accent>/<accent><total>"
  category-title: "<primary>Achievements <dark_gray>·</dark_gray> <category>"
  category:
    progress: "<dark_gray>▸ <info>Tiers: <accent><done></accent>/<accent><total>"
    guided: "<accent>Start here!"
    guided-done: "<success>Done"
    open: "<accent>Click <dark_gray>· <info>open"
  step-name: "<accent>Step <step></accent> <dark_gray>· <name>"
  stars: "<accent><stars>"
  progress: "<accent><bar></accent> <info><value>/<target>"
  reward: "<dark_gray>▸ <info>Reward: <accent><money></accent>, <accent><points> points"
  hint: "<info>Hint: <accent><hint>"
  complete: "<success>Complete!"
  previous: "<accent>« Previous page"
  next: "<accent>Next page »"
  back: "<accent>« Categories"

