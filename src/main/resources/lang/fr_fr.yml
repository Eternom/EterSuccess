# Messages d'EterSuccess, format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (EterLib/config.yml > language.colors) : <primary> <accent> <info> <error> <success>
# Les valeurs entre <> comme <target> sont remplies par le plugin. Pour afficher un "<", écrire \< entre 'guillemets simples'.
# Une clé absente reprend le texte intégré au plugin : tu peux ne garder que les lignes que tu modifies.
# Le nom d'un succès est celui du bloc ou de la créature, traduit par le jeu ; sinon name.<succès> ou subject.<sujet>.

unlock:
  message: "<info>Succès débloqué : <accent><name></accent> ! <accent>+<money></accent>, <accent>+<points> points</accent>."
  step: "<success>Étape réussie :</success> <accent><name></accent> ! <accent>+<money></accent>."
  legend: "<accent><player></accent> <info>atteint le niveau <accent>V</accent> du succès <accent><name></accent> !"

guide:
  next: "<info>Premiers pas <dark_gray>(<step>/<steps>)</dark_gray> : <accent><hint></accent> <dark_gray>· tout le serveur est dans /menu"
  button: "<accent><bold>[Voir mes succès]</bold></accent>"
  button-hover: "<info>Ouvrir <accent>/succes"

menu:
  title: "<primary>Succès"
  player: "<accent><player>"
  points: "<dark_gray>▸ <info>Points de succès : <accent><points>"
  unlocked: "<dark_gray>▸ <info>Niveaux débloqués : <accent><count></accent>/<accent><total>"
  category-title: "<primary>Succès <dark_gray>·</dark_gray> <category>"
  category:
    progress: "<dark_gray>▸ <info>Niveaux : <accent><done></accent>/<accent><total>"
    guided: "<accent>Commence ici !"
    guided-done: "<success>Terminé"
    open: "<accent>Clic <dark_gray>· <info>ouvrir"
  step-name: "<accent>Étape <step></accent> <dark_gray>· <name>"
  stars: "<accent><stars>"
  progress: "<accent><bar></accent> <info><value>/<target>"
  reward: "<dark_gray>▸ <info>Récompense : <accent><money></accent>, <accent><points> points"
  hint: "<info>Indice : <accent><hint>"
  complete: "<success>Terminé !"
  previous: "<accent>« Page précédente"
  next: "<accent>Page suivante »"
  back: "<accent>« Catégories"

category:
  premiers-pas: "<primary>Premiers pas"
  minage: "<primary>Minage"
  terrassement: "<primary>Terrassement"
  bois: "<primary>Bois"
  cultures: "<primary>Cultures"
  elevage: "<primary>Élevage"
  peche: "<primary>Pêche"
  chasse: "<primary>Chasse"
