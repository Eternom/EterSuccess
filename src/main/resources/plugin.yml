name: EterSuccess
version: '${version}'

main: fr.eternom.eterSuccess.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Succès du réseau (Premiers pas pour guider les nouveaux, puis des centaines de niveaux).
depend: [EterLib, EterEconomy]
# Ce que les succès lisent ou écoutent : quêtes (EterJob), défis et pass (EterReward), monde ressource
# (EterResource), homes (EterHome), clan (EterClan). Chacun est facultatif.
softdepend: [EterJob, EterReward, EterResource, EterHome, EterClan]

commands:
  achievements:
    description: Tes succès, et les étapes des Premiers pas.
    usage: /achievements
    aliases: [success]
    permission: etersuccess.use
  stats:
    description: Les statistiques de toujours de tous les joueurs (morts, kills, récolte, temps de jeu).
    usage: /stats [joueur]
    aliases: [statistics]
    permission: etersuccess.stats

permissions:
  etersuccess.use:
    description: Voir ses succès.
    default: true
  etersuccess.stats:
    description: Voir les statistiques des joueurs.
    default: true
  etersuccess.admin:
    description: Toutes les permissions d'EterSuccess.
    default: op
    children:
      etersuccess.use: true
      etersuccess.stats: true
